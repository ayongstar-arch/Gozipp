version: '3.8'

services:
  gozipp-db:
    image: postgis/postgis:15-3.4-alpine
    container_name: gozipp-db
    restart: always
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=50"
    environment:
      POSTGRES_USER: ${DB_USER:-gozipp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gozipp_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-gozipp_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gozipp_user} -d ${DB_NAME:-gozipp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gozipp-redis:
    image: redis:7-alpine
    container_name: gozipp-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-gozipp_redis_secure_2026}", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-gozipp_redis_secure_2026} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gozipp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gozipp-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      gozipp-db:
        condition: service_healthy
      gozipp-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 850M
        reservations:
          memory: 384M

volumes:
  pgdata:
  redisdata:
