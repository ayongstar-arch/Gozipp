services:
  - type: web
    name: gozipp-api-staging
    env: node
    plan: starter
    rootDir: .
    buildCommand: npm install && npm run build --workspace=@gozipp/api
    startCommand: npm run start --workspace=@gozipp/api
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
